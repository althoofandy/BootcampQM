<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Class Table</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #555;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f3f3f3;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Class Name</th>
                <th>Instructor Name</th>
                <th>Class Code</th>
                <th>Student Qty</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Fullstack JavaScript</td>
                <td>Sigit</td>
                <td>FSJS</td>
                <td>5</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Android Kotlin</td>
                <td>Haidar</td>
                <td>AND</td>
                <td>5</td>
            </tr>
            <tr>
                <td>3</td>
                <td>iOS Swift</td>
                <td>Kholis</td>
                <td>IOS</td>
                <td>1</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Data Science</td>
                <td>Lita</td>
                <td>DS</td>
                <td>5</td>
            </tr>
            <tr>
                <td>5</td>
                <td>DevOps</td>
                <td>Muto</td>
                <td>DEVOPS</td>
                <td>10</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Total Student</td>
                <td>26</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
