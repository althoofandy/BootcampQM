<style>
  @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap");

  .grid-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    grid-gap: 10px;
    max-width: 1200px;
    margin: 40px auto;
  }

  .grid-item {
    background-color: #fff;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    padding: 20px;
    font-size: 16px;
    text-align: center;
    font-family: "Poppins", sans-serif;
  }

  .grid-item img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    border-radius: 10px 10px 0 0;
  }

  .grid-item p {
    margin: 10px 0;
  }

  .grid-item p:first-child {
    font-weight: bold;
    font-size: 24px;
  }

  .pokemon-number {
    background-color: #e0b3ff;
    border-radius: 15px;
    padding: 5px 10px;
    display: inline-block;
    margin-top: 10px;
  }

  .search-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px auto;
  }

  .search-bar input {
    padding: 10px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
    font-family: "Poppins", sans-serif;
    width: 200px;
  }

  .search-bar button {
    background-color: #e0b3ff;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }

  .search-header {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 10px;
  }

  .paging {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .paging button {
    background-color: #e0b3ff;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 0 5px;
  }

  .not-found {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 20px;
    color: red;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>

<div class="search-header">Cari Pokemon</div>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="Masukkan nama pokemon" />
  <button id="search-button">Cari</button>
</div>

<div class="grid-container"></div>

<div class="paging">
  <button id="prev-page">Prev</button>
  <button id="page-1">1</button>
  <button id="page-2">2</button>
  <button id="page-3">3</button>
  <button id="page-4">4</button>
  <button id="page-5">5</button>
  <button id="next-page">Next</button>
</div>

<script>
  let currentPage = 1;
  const perPage = 25;

  async function fetchPokemon() {
    const response = await fetch(
      `https://pokeapi.co/api/v2/pokemon/?limit=${perPage}&offset=${
        (currentPage - 1) * perPage
      }`
    );
    const data = await response.json();
    const gridContainer = document.querySelector(".grid-container");
    gridContainer.innerHTML = ""; // Clear previous data

    data.results.forEach(async (pokemon, index) => {
      const pokemonData = await fetch(pokemon.url);
      const pokemonDetail = await pokemonData.json();
      const gridItem = document.createElement("div");
      gridItem.classList.add("grid-item");

      const pokemonImage = document.createElement("img");
      pokemonImage.src = pokemonDetail.sprites.front_default;

      const pokemonName = document.createElement("p");
      pokemonName.textContent = pokemon.name;

      const pokemonWeight = document.createElement("p");
      pokemonWeight.textContent = `Berat: ${pokemonDetail.weight} kg`;

      const pokemonHeight = document.createElement("p");
      pokemonHeight.textContent = `Tinggi: ${pokemonDetail.height} m`;

      const pokemonNumber = document.createElement("p");
      pokemonNumber.classList.add("pokemon-number");
      pokemonNumber.textContent = `#${(currentPage - 1) * perPage + index + 1}`;

      gridItem.appendChild(pokemonImage);
      gridItem.appendChild(pokemonName);
      gridItem.appendChild(pokemonWeight);
      gridItem.appendChild(pokemonHeight);
      gridItem.appendChild(pokemonNumber);

      gridContainer.appendChild(gridItem);
    });
  }

  const searchInput = document.querySelector("#search-input");
  const searchButton = document.querySelector("#search-button");
  const prevPageButton = document.querySelector("#prev-page");
  const nextPageButton = document.querySelector("#next-page");
  const pageButtons = document.querySelectorAll(
    ".paging button:not(#prev-page):not(#next-page)"
  );

  searchButton.addEventListener("click", async () => {
    const searchValue = searchInput.value.toLowerCase();
    const response = await fetch(
      `https://pokeapi.co/api/v2/pokemon/${searchValue}`
    );

    const gridContainer = document.querySelector(".grid-container");
    gridContainer.innerHTML = "";

    if (response.status === 404) {
      const notFound = document.createElement("div");
      notFound.classList.add("not-found");
      notFound.textContent = `Pokemon dengan nama ${searchValue} tidak ditemukan`;
      gridContainer.appendChild(notFound);
    } else {
      const data = await response.json();

      const gridItem = document.createElement("div");
      gridItem.classList.add("grid-item");

      const pokemonImage = document.createElement("img");
      pokemonImage.src = data.sprites.front_default;

      const pokemonName = document.createElement("p");
      pokemonName.textContent = data.name;

      const pokemonWeight = document.createElement("p");
      pokemonWeight.textContent = `Berat: ${data.weight} kg`;

      const pokemonHeight = document.createElement("p");
      pokemonHeight.textContent = `Tinggi: ${data.height} m`;

      const pokemonNumber = document.createElement("p");
      pokemonNumber.classList.add("pokemon-number");
      pokemonNumber.textContent = `#${data.id}`;

      gridItem.appendChild(pokemonImage);
      gridItem.appendChild(pokemonName);
      gridItem.appendChild(pokemonWeight);
      gridItem.appendChild(pokemonHeight);
      gridItem.appendChild(pokemonNumber);

      gridContainer.appendChild(gridItem);
    }
  });

  prevPageButton.addEventListener("click", () => {
    if (currentPage > 1) {
      currentPage--;
      fetchPokemon();
    }
  });

  nextPageButton.addEventListener("click", () => {
    currentPage++;
    fetchPokemon();
  });

  pageButtons.forEach((button) => {
    button.addEventListener("click", () => {
      currentPage = Number(button.textContent);
      fetchPokemon();
    });
  });

  fetchPokemon();
</script>
